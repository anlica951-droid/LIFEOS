
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f6ef">
    <title>LIFEOS | Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #617c62;
            --green-dark: #344c3d;
            --green-deep: #283c31;
            --sage: #a9bd9e;
            --text: #303a32;
            --muted: #899489;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 16px;
            overflow-x: hidden;
            position: relative;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 15% 15%, #e3ecdf 0%, transparent 40%),
                radial-gradient(ellipse at 85% 85%, #e2eadd 0%, transparent 40%),
                linear-gradient(135deg, #f7f8f2, #edf2e9);
        }

        /* Floating background bubbles */

        .bubble {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .bubble-one {
            width: 280px;
            height: 280px;
            top: -90px;
            left: -80px;
            background: rgba(169, 189, 158, .22);
            border: 1px solid rgba(255,255,255,.6);
            box-shadow: inset 0 0 45px rgba(255,255,255,.35);
        }

        .bubble-two {
            width: 360px;
            height: 360px;
            right: -120px;
            bottom: -130px;
            background: rgba(97, 124, 98, .13);
            border: 1px solid rgba(255,255,255,.65);
            box-shadow: inset 0 0 55px rgba(255,255,255,.4);
        }

        .bubble-three {
            width: 85px;
            height: 85px;
            top: 18%;
            right: 17%;
            background: rgba(255,255,255,.25);
            border: 1px solid rgba(255,255,255,.7);
            box-shadow: inset 0 0 25px rgba(255,255,255,.6);
        }

        .bubble-four {
            width: 55px;
            height: 55px;
            bottom: 20%;
            left: 16%;
            background: rgba(169,189,158,.18);
            border: 1px solid rgba(255,255,255,.6);
        }

        /* Main container */

        .login-container {
            width: 100%;
            max-width: 430px;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        /* LIFEOS branding */

        .brand {
            margin-bottom: 30px;
        }

        .brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 43px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--green-dark);
        }

        .brand h1 span {
            color: var(--sage);
        }

        /* Glass bubble */

        .login-card {
            position: relative;
            width: 100%;
            padding: 39px 36px 30px;
            border-radius: 38px;
            background: rgba(255,255,255,.34);
            border: 1px solid rgba(255,255,255,.82);
            box-shadow:
                0 25px 70px rgba(49, 75, 53, .10),
                0 8px 25px rgba(255,255,255,.35),
                inset 0 2px 3px rgba(255,255,255,.85),
                inset 0 -2px 8px rgba(255,255,255,.2);
            backdrop-filter: blur(30px) saturate(145%);
            -webkit-backdrop-filter: blur(30px) saturate(145%);
            overflow: hidden;
        }

        .login-card::before {
            content: "";
            position: absolute;
            width: 230px;
            height: 230px;
            top: -145px;
            left: -85px;
            border-radius: 50%;
            background: rgba(255,255,255,.35);
            filter: blur(4px);
            pointer-events: none;
        }

        .login-card::after {
            content: "";
            position: absolute;
            width: 170px;
            height: 170px;
            bottom: -125px;
            right: -65px;
            border-radius: 50%;
            background: rgba(169,189,158,.15);
            filter: blur(5px);
            pointer-events: none;
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        /* Tabs */

        .tabs {
            display: flex;
            padding: 5px;
            margin-bottom: 28px;
            border-radius: 18px;
            background: rgba(222, 233, 217, .48);
            border: 1px solid rgba(255,255,255,.55);
        }

        .tab {
            flex: 1;
            border: 1px solid transparent;
            padding: 12px 8px;
            border-radius: 14px;
            background: transparent;
            color: #849082;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: .25s ease;
        }

        .tab.active {
            color: var(--green-dark);
            background: rgba(255,255,255,.75);
            border-color: rgba(255,255,255,.8);
            box-shadow: 0 4px 13px rgba(48,65,48,.07);
        }

        /* Form */

        #authForm {
            display: flex;
            flex-direction: column;
            gap: 17px;
            text-align: left;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label {
            font-size: 12px;
            font-weight: 700;
            color: var(--green-dark);
            padding-left: 3px;
        }

        .field input {
            width: 100%;
            height: 53px;
            padding: 0 17px;
            border: 1px solid rgba(255,255,255,.85);
            border-radius: 17px;
            outline: none;
            background: rgba(255,255,255,.42);
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            box-shadow:
                inset 0 2px 5px rgba(255,255,255,.4),
                0 3px 10px rgba(55,75,55,.025);
            transition: .25s ease;
        }

        .field input::placeholder {
            color: #9ba69a;
        }

        .field input:focus {
            background: rgba(255,255,255,.75);
            border-color: rgba(97,124,98,.5);
            box-shadow: 0 0 0 4px rgba(169,189,158,.16);
        }

        [hidden] {
            display: none !important;
        }

        /* Sign in button */

        .primary-btn {
            width: 100%;
            height: 54px;
            margin-top: 5px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 17px;
            background: linear-gradient(135deg, #708a70, #425d48);
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow:
                0 9px 22px rgba(52,76,61,.2),
                inset 0 1px 1px rgba(255,255,255,.25);
            transition: .25s ease;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 13px 26px rgba(52,76,61,.25);
        }

        .primary-btn:disabled,
        .google-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        /* Divider */

        .divider {
            display: flex;
            align-items: center;
            gap: 13px;
            margin: 5px 0;
            color: #929e91;
            font-size: 11px;
            text-align: center;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,.8);
        }

        /* Google button */

        .google-btn {
            width: 100%;
            height: 52px;
            border: 1px solid rgba(255,255,255,.85);
            border-radius: 17px;
            background: rgba(255,255,255,.42);
            color: #465448;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: .25s ease;
        }

        .google-btn:hover {
            background: rgba(255,255,255,.75);
            border-color: white;
        }

        /* Feedback */

        .feedback {
            min-height: 18px;
            margin-top: 0;
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
            color: #9b594e;
        }

        /* Back link */

        .back-link {
            display: inline-block;
            margin-top: 23px;
            color: #718471;
            font-size: 12px;
            text-decoration: none;
            transition: .2s ease;
        }

        .back-link:hover {
            color: var(--green-dark);
        }

        /* Mobile */

        @media (max-width: 480px) {
            body {
                padding: 22px 15px;
            }

            .brand {
                margin-bottom: 23px;
            }

            .brand h1 {
                font-size: 37px;
            }

            .login-card {
                padding: 32px 23px 25px;
                border-radius: 30px;
            }

            .bubble-three {
                right: -25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: .01ms !important;
            }
        }
        /* ERROR NOTIFICATION */

.feedback {
    display: none;
    width: 100%;
    padding: 12px 15px;
    margin: 0 0 19px;
    border: 1px solid rgba(190, 75, 75, .25);
    border-radius: 14px;
    background: rgba(255, 235, 233, .82);
    color: #a33f3f;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.5;
    text-align: left;
    box-shadow: 0 4px 15px rgba(180, 70, 70, .06);
}

.feedback.show {
    display: block;
    animation: notificationAppear .25s ease;
}

.feedback.success {
    color: #476b4b;
    background: rgba(231, 243, 228, .9);
    border-color: rgba(97, 124, 98, .25);
}

/* CARD SHAKE */

.login-card.shake {
    animation: loginShake .4s ease;
    border-color: rgba(190, 75, 75, .65);
    box-shadow:
        0 20px 55px rgba(170, 65, 65, .12),
        0 0 0 4px rgba(190, 75, 75, .08),
        inset 0 2px 3px rgba(255,255,255,.85);
}

/* PASSWORD SHAKE */

.field input.input-error {
    border-color: #d47b76 !important;
    background: rgba(255, 239, 237, .75) !important;
    box-shadow: 0 0 0 3px rgba(212, 123, 118, .12) !important;
    animation: inputShake .35s ease;
}

@keyframes loginShake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-7px); }
    40%, 80% { transform: translateX(7px); }
}

@keyframes inputShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    50% { transform: translateX(4px); }
    75% { transform: translateX(-3px); }
}

@keyframes notificationAppear {
    from {
        opacity: 0;
        transform: translateY(-7px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
    </style> 
    
</head>

<body>

    <!-- Decorative bubbles -->
    <div class="bubble bubble-one"></div>
    <div class="bubble bubble-two"></div>
    <div class="bubble bubble-three"></div>
    <div class="bubble bubble-four"></div>

    <main class="login-container">

        <div class="brand">
            <h1>LIFEOS<span>.</span></h1>
        </div>

        <section class="login-card">
            <div class="card-content">

                <div class="tabs">
    <button class="tab active" id="loginTab" type="button">
        Sign In
    </button>

    <button class="tab" id="registerTab" type="button">
        Create Account
    </button>
</div>

<p class="feedback" id="feedback" role="alert" aria-live="assertive"></p>

                <form id="authForm">

                    <div class="field" id="nameField" hidden>
                        <label for="displayName">Your name</label>
                        <input
                            type="text"
                            id="displayName"
                            placeholder="Enter your name"
                            autocomplete="name"
                        >
                    </div>

                    <div class="field">
                        <label for="email">Email address</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            minlength="6"
                            required
                        >
                    </div>

                    <button class="primary-btn" id="submitBtn" type="submit">
                        Sign In
                    </button>

                    <div class="divider">OR</div>

                    <button class="google-btn" id="googleBtn" type="button">
                        Continue with Google
                    </button>



                </form>

            </div>
        </section>

        <a href="index.html" class="back-link">
            ← Back to LIFEOS
        </a>

    </main>

    <script type="module" src="js/auth.js"></script>

</body>
</html>
